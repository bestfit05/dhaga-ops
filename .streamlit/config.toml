[theme]
base = "light"
primaryColor = "#A84321"
backgroundColor = "#F7F7F2"
secondaryBackgroundColor = "#EEF1E9"
textColor = "#1E3035"
font = "sans serif"

[server]
headless = true
maxUploadSize = 5
# Keep interrupted browser sessions for a day on the same running instance.
disconnectedSessionTTL = 86400
